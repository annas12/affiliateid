<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asam Lambung Naik</title>

  <style>
    :root{
      --green-1:#44d44f;
      --green-2:#35c84a;
      --green-3:#27b742;
      --green-4:#1f9d39;
      --green-dark:#167b2c;

      --white:#ffffff;
      --black:#111111;
      --yellow:#fff22f;
      --red:#ff2d2d;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      overflow-x:hidden;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:
        radial-gradient(circle at center,
          rgba(255,255,255,0.72) 0%,
          rgba(255,255,255,0.52) 14%,
          rgba(233,255,232,0.34) 28%,
          rgba(148,241,142,0.20) 42%,
          rgba(68,212,79,0.08) 58%,
          rgba(68,212,79,0.00) 68%
        ),
        radial-gradient(circle at center,
          #72e165 0%,
          #56d95a 18%,
          #44d44f 38%,
          #30c249 62%,
          #23b240 82%,
          #1c9f39 100%
        );
      position:relative;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      pointer-events:none;
      z-index:0;
      border-radius:50%;
      filter:blur(8px);
      opacity:.42;
    }

    body::before{
      width:220px;
      height:220px;
      top:80px;
      left:-60px;
      background:radial-gradient(circle, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 42%, transparent 75%);
    }

    body::after{
      width:260px;
      height:260px;
      right:-70px;
      bottom:110px;
      background:radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 40%, transparent 75%);
    }

    .page{
      position:relative;
      z-index:1;
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:26px 12px 34px;
    }

    .container{
      width:100%;
      max-width:980px;
      text-align:center;
    }

    .headline{
      max-width:940px;
      margin:0 auto 8px;
    }

    .headline h1{
      margin:0;
      text-transform:uppercase;
      line-height:1.02;
      letter-spacing:-1.2px;
      font-weight:900;
    }

    .headline .line-top{
      display:block;
      font-size:clamp(28px, 4.2vw, 58px);
      color:var(--white);
      text-shadow:
        -2px -2px 0 var(--green-dark),
         2px -2px 0 var(--green-dark),
        -2px  2px 0 var(--green-dark),
         2px  2px 0 var(--green-dark),
         0 5px 0 rgba(10,92,24,0.28),
         0 12px 24px rgba(0,0,0,0.10);
    }

    .headline .line-main{
      display:block;
      margin-top:4px;
      font-size:clamp(34px, 5.3vw, 76px);
      color:var(--yellow);
      text-shadow:
        -2px -2px 0 var(--green-dark),
         2px -2px 0 var(--green-dark),
        -2px  2px 0 var(--green-dark),
         2px  2px 0 var(--green-dark),
        -3px  0px 0 var(--green-dark),
         3px  0px 0 var(--green-dark),
         0px -3px 0 var(--green-dark),
         0px  3px 0 var(--green-dark),
         0 6px 0 rgba(10,92,24,0.28),
         0 14px 26px rgba(0,0,0,0.12);
    }

    .headline h2{
      margin:12px 0 0;
      font-size:clamp(20px, 2.3vw, 34px);
      line-height:1.12;
      font-weight:900;
      letter-spacing:-0.5px;
      color:var(--white);
      text-shadow:
        -1px -1px 0 rgba(14,104,29,0.65),
         1px -1px 0 rgba(14,104,29,0.65),
        -1px  1px 0 rgba(14,104,29,0.65),
         1px  1px 0 rgba(14,104,29,0.65),
         0 8px 18px rgba(0,0,0,0.08);
    }

    .visual{
      width:100%;
      max-width:760px;
      margin:6px auto 8px;
      position:relative;
    }

    .visual::before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:82%;
      height:82%;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.08) 38%, transparent 72%);
      filter:blur(18px);
      z-index:-1;
    }

    .visual img{
      display:block;
      width:100%;
      height:auto;
      margin:0 auto;
      filter:drop-shadow(0 14px 28px rgba(0,0,0,0.12));
    }

    .note{
      max-width:920px;
      margin:10px auto 0;
      padding:0 6px;
    }

    .note p{
      margin:0;
      font-size:clamp(18px, 1.8vw, 28px);
      line-height:1.34;
      font-weight:900;
      letter-spacing:-0.3px;
      color:var(--white);
      text-shadow:
        -1px -1px 0 rgba(14,104,29,0.52),
         1px -1px 0 rgba(14,104,29,0.52),
        -1px  1px 0 rgba(14,104,29,0.52),
         1px  1px 0 rgba(14,104,29,0.52),
         0 8px 18px rgba(0,0,0,0.08);
    }

    .note .highlight{
      color:var(--yellow);
      text-shadow:
        -1px -1px 0 var(--green-dark),
         1px -1px 0 var(--green-dark),
        -1px  1px 0 var(--green-dark),
         1px  1px 0 var(--green-dark);
    }

    @media (max-width: 768px){
      .page{
        padding:18px 10px 24px;
      }

      .headline{
        margin-bottom:6px;
      }

      .headline .line-top{
        font-size:clamp(24px, 7vw, 40px);
        line-height:1.04;
      }

      .headline .line-main{
        margin-top:3px;
        font-size:clamp(29px, 8.5vw, 50px);
        line-height:1.02;
      }

      .headline h2{
        margin-top:10px;
        font-size:clamp(17px, 5vw, 23px);
        line-height:1.14;
      }

      .visual{
        max-width:100%;
        margin:6px auto 8px;
      }

      .note{
        margin-top:8px;
        padding:0 2px;
      }

      .note p{
        font-size:clamp(15px, 4.5vw, 19px);
        line-height:1.35;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <section class="headline">
        <h1>
          <span class="line-top">JANGAN SEPELEKAN</span>
          <span class="line-main">ASAM LAMBUNG NAIK</span>
        </h1>
        <h2>Atasi Sekarang Sebelum Kronis!</h2>
      </section>

      <section class="visual">
        <img src="./gambar2.png" alt="">
      </section>

      <section class="note">
        <p>
          “Luangkan Waktu Selama 2-3 Menit Untuk Membaca Website Ini<br>
          Agar <span class="highlight">Asam Lambung Naik</span> Dapat Teratasi”
        </p>
      </section>
    </div>
  </main>
</body>
</html>
